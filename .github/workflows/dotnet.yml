name: Build and test

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FileFlowMonitor.sln
      - name: Build
        run: dotnet build FileFlowMonitor.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test FileFlowMonitor.sln --configuration Release --no-build
