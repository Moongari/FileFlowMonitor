name: Build and test

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      # Install both SDKs so the CI matrix can compile and test each target.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore FileFlowMonitor.sln
      - name: Build
        run: dotnet build FileFlowMonitor.sln --configuration Release --framework ${{ matrix.framework }} --no-restore
      - name: Test
        run: dotnet test FileFlowMonitor.sln --configuration Release --framework ${{ matrix.framework }} --no-build
